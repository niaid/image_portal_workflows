[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "image-portal-workflows"
version = "0.1.0"
requires-python = ">=3.13,<3.14"
description = "Image portal workflows using Prefect, Dask, and scientific Python tools."
readme = "README.rst"
authors = [
    { name = "Philip MacMenamin", email = "philip.macmenamin@nih.gov" },
    { name = "Bradley Lowekamp", email = "blowekamp@mail.nih.gov" },
    { name = "Anish Shrestha", email = "anish.shrestha@nih.gov" },
]

dependencies = [
    "dask-jobqueue==0.9.0",
    "jinja2==3.1.6",
    "natsort==8.4.0",
    "prefect[dask]==3.7.5",
    "python-dotenv==1.2.2",
    "pytools",
    "requests==2.34.2",
    "simpleitk~=2.5.0",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["em_workflows", "em_workflows.*"]

[tool.setuptools.package-data]
em_workflows = ["templates/*.adoc"]

[tool.uv.sources]
pytools = { url = "https://github.com/niaid/tomojs-pytools/releases/download/v3.3.2/pytools-3.3.2-py3-none-any.whl" }

[dependency-groups]
dev = [
    "black==26.5.1",
    "coverage>=7.14.3",
    "coverage-badge>=1.1.2",
    "flake8==7.3.0",
    "pre-commit==4.6.0",
    "pytest~=9.1",
    "pytest-asyncio==1.4.0",
    "pytest-cov==7.1.0",
    "pytest-env==1.6.0",
    "sphinx-autobuild==2025.8.25",
    "sphinx-rtd-theme==3.1.0",
]
